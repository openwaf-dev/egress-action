name: exp
on:
  push:
    branches: [exp-daemon-probe]
jobs:
  docker-lock:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mode: [audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          mkdir -p "$RUNNER_TEMP/nosudo"; printf '#!/bin/sh\nexit 1\n' >"$RUNNER_TEMP/nosudo/sudo"; chmod +x "$RUNNER_TEMP/nosudo/sudo"
          echo "$RUNNER_TEMP/nosudo" >>"$GITHUB_PATH"
          printf 'version: 1\npresets: [github-actions]\nallow: [auth.docker.io, registry-1.docker.io, production.cloudfront.docker.com, production.cloudflare.docker.com, pkg-containers.githubusercontent.com]\n' >"$RUNNER_TEMP/p.yml"
      - uses: ./
        with:
          policy: ${{ runner.temp }}/p.yml
          mode: ${{ matrix.mode }}
      - run: |
          t=egress_ci_$(id -u)
          /usr/bin/sudo nft insert rule inet $t job_nat socket cgroupv2 level 2 "system.slice/docker.service" counter
          /usr/bin/sudo nft insert rule inet $t job_nat meta skuid 0 meta l4proto tcp ip daddr != 127.0.0.0/8 counter
          /usr/bin/sudo nft insert rule inet $t job_nat socket cgroupv2 level 2 "system.slice/docker.service" meta l4proto tcp counter
          /usr/bin/sudo nft insert rule inet $t job_nat socket cgroupv2 level 2 "system.slice/docker.service" meta l4proto tcp ip daddr != { 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12 } fib daddr type != local counter
          (while sleep 0.2; do /usr/bin/sudo ss -tnp state all '( dport = :30305 or sport = :30305 )' 2>/dev/null | grep -v State; done) >"$RUNNER_TEMP/ss.txt" & sp=$!
          docker pull -q busybox:latest
          docker pull -q ghcr.io/linuxcontainers/alpine:latest
          kill $sp; sort -u "$RUNNER_TEMP/ss.txt" | head -20
          /usr/bin/sudo conntrack -L -p tcp 2>/dev/null | grep -E '127.0.0.2|30305' | head -5 || true
          /usr/bin/sudo nft list chain inet $t job_nat
          /usr/bin/sudo cat /proc/$(pgrep -x dockerd | head -1)/cgroup; pgrep -a dockerd
          /usr/bin/sudo ls -lid /sys/fs/cgroup/system.slice/docker.service
          grep -c daemon "$EGRESS_CI_STATE/events.jsonl" || true
      - run: tests/pulls.sh enforce
      - if: always()
        run: |
          /usr/bin/sudo nft list table inet egress_ci_$(id -u)
          grep -o '"kind":"[a-z]*"' "$EGRESS_CI_STATE/events.jsonl" | sort | uniq -c
          docker logs egress-ci-$(id -u) 2>&1 | tail -5
          /usr/bin/sudo ls -la /proc/$(pgrep -x dockerd)/ns/cgroup /proc/1/ns/cgroup
          cid=$(docker inspect -f '{{.Id}}' egress-ci-$(id -u)); /usr/bin/sudo cat /proc/$(docker inspect -f '{{.State.Pid}}' egress-ci-$(id -u))/cgroup
